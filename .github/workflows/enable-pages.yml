name: enable-pages
on:
  push:
    branches: [gh-pages]
permissions:
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from gh-pages branch
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          cat /tmp/resp.json
          echo "HTTP $code"
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then exit 0; else exit 1; fi
