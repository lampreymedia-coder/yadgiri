services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Tehran}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - spool:/srv/app/spool
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  migrate:
    build: .
    env_file: .env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # Local development database. In production use Arvan managed PostgreSQL
  # (DBaaS) and point DATABASE_URL at it; then remove/ignore this service.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bale_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bale_archive"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["webhook"]
    ports:
      - "443:443"
      - "88:88"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  spool:
  redis-data:
  pg-data:
  caddy-data:
  caddy-config:
