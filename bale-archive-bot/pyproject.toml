[project]
name = "bale-archive-bot"
version = "1.0.0"
description = "Production-grade archive bot for the Bale messenger."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "apscheduler>=3.10,<4",
    "aioboto3>=13.0",
    "jdatetime>=5.0",
    "openpyxl>=3.1",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers>=4.5",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "A", "C4", "T20", "RET", "SIM"]
ignore = [
    "S101",  # assert allowed in tests
    "S311",  # random for non-crypto short ids is fine (secrets used where needed)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "T20"]
"scripts/**" = ["T20", "S603", "S607"]
# Exception class names are mandated by the project spec (section 5).
"app/bale/errors.py" = ["N818"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = "alembic/"

[[tool.mypy.overrides]]
module = ["aioboto3.*", "apscheduler.*", "jdatetime.*", "testcontainers.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app/domain", "app/core", "app/handlers"]
